version: '3.8'

services:
  # ============================================
  # Nginx — Reverse Proxy & Frontend Host
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: karyawan_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - api
    restart: always
    networks:
      - karyawan_net

  # ============================================
  # FastAPI — Backend API Server
  # ============================================
  api:
    build: ./backend
    container_name: karyawan_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - ~/.ssh:/root/.ssh:ro
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - karyawan_net

  # ============================================
  # Celery Worker — Background Task Processor
  # ============================================
  celery_worker:
    build: ./backend
    container_name: karyawan_celery
    command: celery -A celery_app worker --beat --loglevel=info --concurrency=2 -Q default,arif,budi,citra,dewi,eka,fajar,gita,hana,indra
    volumes:
      - ./backend:/app
      - ~/.ssh:/root/.ssh:ro
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - karyawan_net

  # ============================================
  # Redis — Message Broker & Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: karyawan_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data
    networks:
      - karyawan_net

  # ============================================
  # PostgreSQL — Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: karyawan_postgres
    environment:
      POSTGRES_USER: karyawan
      POSTGRES_PASSWORD: karyawan_secret_2026
      POSTGRES_DB: karyawan_ai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karyawan -d karyawan_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - karyawan_net

volumes:
  redis_data:
  postgres_data:

networks:
  karyawan_net:
    driver: bridge
